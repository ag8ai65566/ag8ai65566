[project]
name = "voice-studio"
version = "0.1.0"
description = "Personal voice studio: consent-gated dataset prep, cloud GPU fine-tuning and local text-to-speech"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "scipy>=1.11",
  "soundfile>=0.12",
  "imageio-ffmpeg>=0.5",
  "onnxruntime>=1.18",
  "boto3>=1.34",
  "keyring>=25",
  "httpx>=0.27",
  "huggingface_hub>=0.24",
]

[project.optional-dependencies]
# Data preparation on an NVIDIA GPU (installed by install.bat)
prep = [
  "torch>=2.4",
  "torchaudio>=2.4",
  "faster-whisper>=1.1",
  "audio-separator>=0.30",
]
dev = ["pytest>=8"]

[project.scripts]
voice-studio = "vstudio.server:main"

[tool.setuptools.packages.find]
include = ["vstudio*"]

[tool.setuptools.package-data]
vstudio = ["cloud/bootstrap/*.sh"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
